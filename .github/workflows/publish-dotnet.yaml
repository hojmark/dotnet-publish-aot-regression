name: Publish AOT
permissions:
  contents: read

on:
  workflow_dispatch:

jobs:
  test:
    name: Publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.2xx

      - name: Build
        run: |
          dotnet build

      - name: Publish
        run: |
          dotnet publish --runtime linux-x64 --self-contained --no-restore --no-build